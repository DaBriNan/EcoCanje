apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recuperacion
resources: [../base]
labels:
- pairs: {ambiente: recuperacion}
images:
- {name: ecocanje-backend, newTag: "0.1.1"}
patches:
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: ecocanje}
- patch: |-
    $patch: delete
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: respaldo-postgres}
- patch: |-
    $patch: delete
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: respaldo-mongo}
- patch: |-
    $patch: delete
    apiVersion: batch/v1
    kind: Job
    metadata: {name: migraciones}
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: outbox-worker}
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: respaldos}
