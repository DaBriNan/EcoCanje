apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../base]
labels:
- pairs: {ambiente: dev}
images:
- {name: ecocanje-backend, newTag: "0.1.3"}
- {name: ecocanje-frontend, newTag: "0.1.4"}
configMapGenerator:
- name: app-config
  behavior: merge
  literals: [APP_NAME=EcoCanje-dev, APP_URL=https://dev.ecocanje.test:8444]
patches:
- target: {kind: Ingress, name: ecocanje}
  patch: |-
    - {op: replace, path: /spec/rules/0/host, value: dev.ecocanje.test}
    - {op: replace, path: /spec/tls/0/hosts/0, value: dev.ecocanje.test}
