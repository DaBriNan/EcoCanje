apiVersion: v1
kind: ConfigMap
metadata: {name: mongo-init}
data:
  01-usuarios.sh: |
    #!/bin/sh
    set -e
    S=/run/secrets/mongo
    mongosh --quiet --host 127.0.0.1 -u ecocanje_root -p "$(cat $S/root)" --authenticationDatabase admin <<JS
    const e = db.getSiblingDB('ecocanje'), a = db.getSiblingDB('admin');
    e.createUser({user: 'ecocanje_app', pwd: '$(cat $S/app)', roles: [{role: 'readWrite', db: 'ecocanje'}]});
    e.createUser({user: 'ecocanje_migrador', pwd: '$(cat $S/migrador)', roles: [{role: 'readWrite', db: 'ecocanje'}, {role: 'dbAdmin', db: 'ecocanje'}]});
    a.createUser({user: 'ecocanje_backup', pwd: '$(cat $S/backup)', roles: [{role: 'backup', db: 'admin'}]});
    a.createUser({user: 'ecocanje_monitor', pwd: '$(cat $S/monitor)', roles: [{role: 'clusterMonitor', db: 'admin'}]});
    JS
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {app: mongo}
spec:
  selector: {app: mongo}
  ports:
  - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels: {app: mongo}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: mongo
        image: mongo:7
        args: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB=0.25"]
        ports:
        - {name: mongo, containerPort: 27017}
        env:
        - {name: MONGO_INITDB_ROOT_USERNAME, value: ecocanje_root}
        - {name: MONGO_INITDB_ROOT_PASSWORD_FILE, value: /run/secrets/mongo/root}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        startupProbe:
          tcpSocket: {port: mongo}
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket: {port: mongo}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: mongo}
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - {name: data, mountPath: /data/db}
        - {name: configdb, mountPath: /data/configdb}
        - {name: tmp, mountPath: /tmp}
        - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
        - {name: credenciales, mountPath: /run/secrets/mongo, readOnly: true}
      volumes:
      - {name: configdb, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      - name: init
        configMap: {name: mongo-init, defaultMode: 365}
      - name: credenciales
        secret: {secretName: mongo-credenciales, defaultMode: 288}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests: {storage: 2Gi}
