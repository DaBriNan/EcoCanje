# Loki monolítico con disco local (laboratorio): sin gateway, cachés, canary ni MinIO. Pod Security restricted.
fullnameOverride: loki
deploymentMode: SingleBinary
loki:
  image: {tag: 3.7.9, digest: "sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28"}
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
    - {from: "2026-11-01", store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
  limits_config: {retention_period: 48h, allow_structured_metadata: true, volume_enabled: true, ingestion_rate_mb: 8, ingestion_burst_size_mb: 16}
  compactor: {retention_enabled: true, delete_request_store: filesystem, working_directory: /var/loki/compactor}
  pattern_ingester: {enabled: false}
  analytics: {reporting_enabled: false}   # sin envío de datos a terceros
singleBinary:
  replicas: 1
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
  persistence: {enabled: true, size: 2Gi, storageClass: local-path}
  affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]}]}}}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
sidecar: {rules: {enabled: false}}
monitoring: {serviceMonitor: {enabled: true}}
