# SPA estática; /api la enruta el Ingress al backend (mismo origen), así que nginx nunca la recibe.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { include /etc/nginx/seguridad.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/seguridad.conf; add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
