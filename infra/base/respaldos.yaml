apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: respaldos}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: respaldo-postgres, labels: {app: respaldo}}
spec:
  schedule: "0 2 * * *"
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: respaldo, postgres-egress: permitido, postgres-ingress: permitido}
        spec:
          restartPolicy: Never
          serviceAccountName: respaldo
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: pg-dump
            image: postgres
            command: ["/bin/sh", "-ec"]
            args:
            - |
              D=/respaldos/postgres; mkdir -p $D; rm -f $D/*.tmp
              F=$D/pg-$(date +%Y%m%d-%H%M%S).dump
              n=0; until pg_isready -q -h postgres -p 5432 -U ecocanje_backup; do n=$((n+1)); [ $n -gt 30 ] && { echo "postgres no responde"; exit 1; }; sleep 2; done
              export PGPASSWORD=$(cat /run/secrets/pg/backup)
              pg_dump -h postgres -U ecocanje_backup -d ecocanje -Fc -f "$F.tmp"
              mv "$F.tmp" "$F"
              pg_restore --list "$F" > /dev/null
              B=$(basename "$F")
              (cd $D && sha256sum "$B" > "$B.sha256" && sha256sum -c "$B.sha256")
              ls -1t $D/pg-*.dump | tail -n +8 | while read -r f; do rm -f "$f" "$f.sha256"; done
              echo "respaldo_ok archivo=$B bytes=$(stat -c %s "$F") fecha=$(date -Is)"
            securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
            resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
            volumeMounts:
            - {name: respaldos, mountPath: /respaldos}
            - {name: credenciales, mountPath: /run/secrets/pg, readOnly: true}
          volumes:
          - name: respaldos
            persistentVolumeClaim: {claimName: respaldos}
          - name: credenciales
            secret: {secretName: postgres-credenciales, defaultMode: 288, items: [{key: backup, path: backup}]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: respaldo-mongo, labels: {app: respaldo}}
spec:
  schedule: "10 2 * * *"
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: respaldo, mongo-egress: permitido, mongo-ingress: permitido}
        spec:
          restartPolicy: Never
          serviceAccountName: respaldo
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: mongodump
            image: mongo
            command: ["/bin/sh", "-ec"]
            args:
            - |
              D=/respaldos/mongo; mkdir -p $D; rm -f $D/*.tmp
              F=$D/mongo-$(date +%Y%m%d-%H%M%S).archive.gz
              (umask 077; printf '%s: %s\n' password "$(cat /run/secrets/mongo/backup)" > /tmp/m.yml)
              mongodump --config=/tmp/m.yml --host=mongo --username=ecocanje_backup --authenticationDatabase=admin --db=ecocanje --archive="$F.tmp" --gzip
              rm -f /tmp/m.yml
              mv "$F.tmp" "$F"
              B=$(basename "$F")
              test "$(stat -c %s "$F")" -gt 100
              (cd $D && sha256sum "$B" > "$B.sha256" && sha256sum -c "$B.sha256")
              ls -1t $D/mongo-*.archive.gz | tail -n +8 | while read -r f; do rm -f "$f" "$f.sha256"; done
              echo "respaldo_ok archivo=$B bytes=$(stat -c %s "$F") fecha=$(date -Is)"
            env: [{name: HOME, value: /tmp}]
            securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
            resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 384Mi}}
            volumeMounts:
            - {name: respaldos, mountPath: /respaldos}
            - {name: tmp, mountPath: /tmp}
            - {name: credenciales, mountPath: /run/secrets/mongo, readOnly: true}
          volumes:
          - name: respaldos
            persistentVolumeClaim: {claimName: respaldos}
          - {name: tmp, emptyDir: {}}
          - name: credenciales
            secret: {secretName: mongo-credenciales, defaultMode: 288, items: [{key: backup, path: backup}]}
