apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: denegar-todo}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: permitir-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-ingreso}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {postgres-ingress: permitido}}}]
    ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: clientes-postgres-egreso}
spec:
  podSelector: {matchLabels: {postgres-egress: permitido}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mongo-ingreso}
spec:
  podSelector: {matchLabels: {app: mongo}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {mongo-ingress: permitido}}}]
    ports: [{protocol: TCP, port: 27017}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: clientes-mongo-egreso}
spec:
  podSelector: {matchLabels: {mongo-egress: permitido}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: mongo}}}]
    ports: [{protocol: TCP, port: 27017}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: backend-ingreso}
spec:
  podSelector: {matchLabels: {app: backend}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
    ports: [{protocol: TCP, port: 8080}]
