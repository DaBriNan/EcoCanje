# Correlación: se acepta X-Request-Id entrante si tiene formato válido; si no, nginx genera uno ($request_id).
map $http_x_request_id $rid {
  "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
  default $request_id;
}
# Las sondas del kubelet no se registran (ruido); el resto sí, con fecha ISO 8601 y rid.
map $http_user_agent $registrar {
  ~^kube-probe 0;
  default 1;
}
log_format ecocanje '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent $request_time rid=$rid';

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  access_log /dev/stdout ecocanje if=$registrar;
  add_header X-Request-Id $rid always;
  location / {
    include /etc/nginx/fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /app/public;
    fastcgi_param HTTP_X_REQUEST_ID $rid;
    fastcgi_read_timeout 30s;
  }
}
